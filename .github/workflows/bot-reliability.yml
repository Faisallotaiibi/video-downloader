name: Bot reliability
on:
  push:
    branches: [main, bot-reliability-verification]
  workflow_dispatch:
  schedule:
    - cron: '3-58/5 * * * *'
permissions:
  contents: read
concurrency:
  group: bot-reliability-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v4
      - name: Use production Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test delivery and existing media features
        env:
          BOT_TOKEN: '123456789:unit_test_only'
          BOT_TRANSPORT: polling
        run: python -m unittest -v test_bot_heartbeat test_reliable_delivery test_media_support test_signatures
  availability:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify the public bot service and wake it if needed
        shell: bash
        run: |
          curl --fail --silent --show-error --connect-timeout 10 --max-time 90 --retry 2 --retry-all-errors --retry-delay 5 'https://video-downloader-0ea4.onrender.com/healthz?probe=availability' > health.json
          python3 -c 'import json; data=json.load(open("health.json")); assert data.get("ok") is True and data.get("transport") == "webhook" and data.get("persistent_inbox") is True; print("Public service ready with persistent Telegram delivery")'
